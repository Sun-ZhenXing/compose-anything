x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 100m
      max-file: '3'

services:
  # Kafka broker in KRaft mode (single node, combined broker + controller)
  kafka:
    <<: *defaults
    image: ${GLOBAL_REGISTRY:-}confluentinc/cp-kafka:${KAFKA_VERSION:-8.3.2}
    ports:
      - '${KAFKA_BROKER_PORT_OVERRIDE:-9092}:9092'
      - '${KAFKA_JMX_PORT_OVERRIDE:-9999}:9999'
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      - TZ=${TZ:-UTC}
      # KRaft cluster metadata. Must stay stable for the lifetime of the kafka_data volume.
      - CLUSTER_ID=${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:29093
      - KAFKA_LISTENERS=PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_NUM_PARTITIONS=${KAFKA_NUM_PARTITIONS:-3}
      - KAFKA_DEFAULT_REPLICATION_FACTOR=${KAFKA_DEFAULT_REPLICATION_FACTOR:-1}
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=${KAFKA_AUTO_CREATE_TOPICS_ENABLE:-true}
      - KAFKA_DELETE_TOPIC_ENABLE=${KAFKA_DELETE_TOPIC_ENABLE:-true}
      - KAFKA_LOG_RETENTION_HOURS=${KAFKA_LOG_RETENTION_HOURS:-168}
      - KAFKA_LOG_SEGMENT_BYTES=${KAFKA_LOG_SEGMENT_BYTES:-1073741824}
      - KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS=300000
      - KAFKA_JMX_PORT=9999
      - KAFKA_JMX_HOSTNAME=localhost
      - KAFKA_HEAP_OPTS=${KAFKA_HEAP_OPTS:--Xmx1G -Xms1G}
    deploy:
      resources:
        limits:
          cpus: ${KAFKA_CPU_LIMIT:-2.0}
          memory: ${KAFKA_MEMORY_LIMIT:-2G}
        reservations:
          cpus: ${KAFKA_CPU_RESERVATION:-0.1}
          memory: ${KAFKA_MEMORY_RESERVATION:-1G}
    healthcheck:
      test:
        - CMD-SHELL
        - 'kafka-broker-api-versions --bootstrap-server localhost:9092'

      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Kafka UI (optional)
  kafka-ui:
    <<: *defaults
    image: ${GLOBAL_REGISTRY:-}provectuslabs/kafka-ui:${KAFKA_UI_VERSION:-v0.7.2}
    profiles:
      - ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - '${KAFKA_UI_PORT_OVERRIDE:-8080}:8080'
    environment:
      - TZ=${TZ:-UTC}
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
      - KAFKA_CLUSTERS_0_READONLY=${KAFKA_UI_READONLY:-false}
    deploy:
      resources:
        limits:
          cpus: ${KAFKA_UI_CPU_LIMIT:-0.5}
          memory: ${KAFKA_UI_MEMORY_LIMIT:-512M}
        reservations:
          cpus: ${KAFKA_UI_CPU_RESERVATION:-0.1}
          memory: ${KAFKA_UI_MEMORY_RESERVATION:-128M}

volumes:
  kafka_data:
