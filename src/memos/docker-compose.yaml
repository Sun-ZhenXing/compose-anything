x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 100m
      max-file: '3'

services:
  memos:
    <<: *defaults
    image: ${GLOBAL_REGISTRY:-}neosmemo/memos:${MEMOS_VERSION:-0.30.0}
    ports:
      - '${MEMOS_BIND_ADDRESS:-127.0.0.1}:${MEMOS_PORT_OVERRIDE:-5230}:5230'
    volumes:
      - memos_data:/var/opt/memos
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ:-UTC}
      MEMOS_ADDR: 0.0.0.0
      MEMOS_PORT: 5230
      MEMOS_DATA: /var/opt/memos
      MEMOS_DRIVER: ${MEMOS_DRIVER:-sqlite}
      MEMOS_DSN: ${MEMOS_DSN:-}
      MEMOS_INSTANCE_URL: ${MEMOS_INSTANCE_URL:-}
    deploy:
      resources:
        limits:
          cpus: ${MEMOS_CPU_LIMIT:-1.0}
          memory: ${MEMOS_MEMORY_LIMIT:-512M}
        reservations:
          cpus: ${MEMOS_CPU_RESERVATION:-0.1}
          memory: ${MEMOS_MEMORY_RESERVATION:-128M}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://localhost:5230/healthz']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  memos_data:
