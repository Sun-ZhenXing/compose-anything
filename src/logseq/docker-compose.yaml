x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  logseq:
    <<: *defaults
    # Upstream publishes no release-version tags; pin the multi-platform image digest.
    image: ${GLOBAL_REGISTRY:-ghcr.io/}logseq/logseq-webapp@${LOGSEQ_IMAGE_DIGEST:-sha256:de87c4a26986278b52f778d4d28c03e32d68a7c7f42bae128614bcaa3f26c231}
    user: '101:101'
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - '${LOGSEQ_BIND_ADDRESS:-127.0.0.1}:${LOGSEQ_PORT_OVERRIDE:-3001}:80'
    environment:
      - TZ=${TZ:-UTC}
    # Nginx needs writable cache and PID directories, not persistent graph storage.
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0750,size=16m
      - /var/run:uid=101,gid=101,mode=0750,size=1m
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: ${LOGSEQ_CPU_LIMIT:-0.5}
          memory: ${LOGSEQ_MEMORY_LIMIT:-128M}
        reservations:
          cpus: ${LOGSEQ_CPU_RESERVATION:-0.1}
          memory: ${LOGSEQ_MEMORY_RESERVATION:-32M}
