# astron-agent: iFLYTEK's open-source agentic workflow platform.
# Ported from the official deployment under docker/astronAgent/ of
# https://github.com/iflytek/astron-agent (tag 1.1.2).
#
# Start everything with `docker compose up -d`. The optional Casdoor login
# stack lives behind the `auth` profile.

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 100m
      max-file: '3'

services:
  # ============================================================================
  # Infrastructure Services
  # ============================================================================

  # Generate deployment-internal credentials once and persist them in named
  # volumes. Existing strong .env overrides are preserved; published legacy
  # defaults are rotated automatically so upgrades remain zero-configuration.
  internal-credentials-init:
    image: ${GLOBAL_REGISTRY:-}busybox:${BUSYBOX_VERSION:-1.35}
    environment:
      CONFIGURED_WORKFLOW_INTERNAL_API_KEY: "${WORKFLOW_INTERNAL_API_KEY:-}"
      CONFIGURED_TENANT_KEY: "${TENANT_KEY:-}"
      CONFIGURED_TENANT_SECRET: "${TENANT_SECRET:-}"
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        legacy_tenant_key='7b709739e8da44536127a333c7603a83'
        legacy_tenant_secret='NjhmY2NmM2NkZDE4MDFlNmM5ZjcyZjMy'
        workflow_placeholder='CHANGE_ME_WORKFLOW_INTERNAL_API_KEY'

        safe_token() {
          value="$$1"
          min_length="$$2"
          max_length="$$3"
          [ "$${#value}" -ge "$$min_length" ] || return 1
          [ "$${#value}" -le "$$max_length" ] || return 1
          case "$$value" in *[!A-Za-z0-9._~-]*) return 1 ;; esac
        }

        read_valid_file() {
          file="$$1"
          min_length="$$2"
          max_length="$$3"
          [ -f "$$file" ] && [ ! -L "$$file" ] || return 1
          value="$$(sed -n '1p' "$$file")"
          safe_token "$$value" "$$min_length" "$$max_length" || return 1
          printf '%s' "$$value"
        }

        generate_hex() {
          byte_count="$$1"
          value="$$(dd if=/dev/urandom bs="$$byte_count" count=1 2>/dev/null | od -An -tx1 | tr -d ' \n')"
          [ "$${#value}" -eq "$$((byte_count * 2))" ] || {
            echo 'Unable to generate internal credentials.' >&2
            exit 1
          }
          printf '%s' "$$value"
        }

        write_secret() {
          directory="$$1"
          name="$$2"
          value="$$3"
          temporary="$$directory/.$$name.tmp.$$$$"
          mkdir -p "$$directory"
          printf '%s\n' "$$value" > "$$temporary"
          chmod 0444 "$$temporary"
          mv -f "$$temporary" "$$directory/$$name"
        }

        workflow_key="$$CONFIGURED_WORKFLOW_INTERNAL_API_KEY"
        if [ "$$workflow_key" = "$$workflow_placeholder" ]; then
          workflow_key=''
        fi
        if [ -n "$$workflow_key" ]; then
          safe_token "$$workflow_key" 32 128 || {
            echo 'WORKFLOW_INTERNAL_API_KEY must contain 32-128 safe characters.' >&2
            exit 1
          }
        else
          workflow_key="$$(read_valid_file /secrets/workflow/workflow-internal-api-key 32 128 || true)"
          if [ "$$workflow_key" = "$$workflow_placeholder" ]; then
            workflow_key=''
          fi
          [ -n "$$workflow_key" ] || workflow_key="$$(generate_hex 32)"
        fi

        tenant_key="$$CONFIGURED_TENANT_KEY"
        tenant_secret="$$CONFIGURED_TENANT_SECRET"
        if [ "$$tenant_key" = "$$legacy_tenant_key" ] && [ "$$tenant_secret" = "$$legacy_tenant_secret" ]; then
          tenant_key=''
          tenant_secret=''
        fi
        if [ -n "$$tenant_key" ] || [ -n "$$tenant_secret" ]; then
          safe_token "$$tenant_key" 32 50 && safe_token "$$tenant_secret" 32 50 && \
            [ "$$tenant_key" != "$$tenant_secret" ] && \
            [ "$$tenant_key" != "$$legacy_tenant_key" ] && \
            [ "$$tenant_secret" != "$$legacy_tenant_secret" ] || {
            echo 'TENANT_KEY and TENANT_SECRET must be distinct 32-50 character safe values.' >&2
            exit 1
          }
        else
          tenant_key="$$(read_valid_file /secrets/tenant/tenant-key 32 50 || true)"
          tenant_secret="$$(read_valid_file /secrets/tenant/tenant-secret 32 50 || true)"
          if [ "$$tenant_key" = "$$legacy_tenant_key" ] || [ "$$tenant_secret" = "$$legacy_tenant_secret" ] || [ "$$tenant_key" = "$$tenant_secret" ]; then
            tenant_key=''
            tenant_secret=''
          fi
          if [ -z "$$tenant_key" ] || [ -z "$$tenant_secret" ]; then
            tenant_key="$$(generate_hex 24)"
            tenant_secret="$$(generate_hex 24)"
          fi
        fi

        write_secret /secrets/workflow workflow-internal-api-key "$$workflow_key"
        write_secret /secrets/tenant tenant-key "$$tenant_key"
        write_secret /secrets/tenant tenant-secret "$$tenant_secret"

        workflow_properties="/secrets/workflow/.workflow-internal.properties.tmp.$$$$"
        printf 'workflow.internal-api-key=%s\n' "$$workflow_key" > "$$workflow_properties"
        chmod 0444 "$$workflow_properties"
        mv -f "$$workflow_properties" /secrets/workflow/workflow-internal.properties

        tenant_properties="/secrets/tenant/.tenant-bootstrap.properties.tmp.$$$$"
        {
          printf 'api.url.tenantId=680ab54f\n'
          printf 'api.url.tenantKey=%s\n' "$$tenant_key"
          printf 'api.url.tenantSecret=%s\n' "$$tenant_secret"
          printf 'api.url.apiKey=%s\n' "$$tenant_key"
          printf 'api.url.apiSecret=%s\n' "$$tenant_secret"
          printf 'common.appid=680ab54f\n'
          printf 'common.apiKey=%s\n' "$$tenant_key"
          printf 'common.apiSecret=%s\n' "$$tenant_secret"
          printf 'maas.appId=680ab54f\n'
          printf 'maas.apiKey=%s\n' "$$tenant_key"
          printf 'maas.apiSecret=%s\n' "$$tenant_secret"
          printf 'maas.consumerId=680ab54f\n'
          printf 'maas.consumerKey=%s\n' "$$tenant_key"
          printf 'maas.consumerSecret=%s\n' "$$tenant_secret"
        } > "$$tenant_properties"
        chmod 0444 "$$tenant_properties"
        mv -f "$$tenant_properties" /secrets/tenant/tenant-bootstrap.properties
        echo 'Internal credentials are initialized.'
    network_mode: none
    volumes:
      - workflow_internal_secrets:/secrets/workflow
      - tenant_bootstrap_secrets:/secrets/tenant
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: ${INTERNAL_CREDENTIALS_INIT_CPU_LIMIT:-0.1}
          memory: ${INTERNAL_CREDENTIALS_INIT_MEMORY_LIMIT:-64M}

  # PostgreSQL Database
  postgres:
    <<: *defaults
    image: ${GLOBAL_REGISTRY:-}postgres:${POSTGRES_VERSION:-14}
    environment:
      TZ: ${TZ:-UTC}
      POSTGRES_DB: sparkdb_manager
      POSTGRES_USER: ${POSTGRES_USER:-spark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spark123}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - astron-agent-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spark} -d sparkdb_manager"]
      interval: ${HEALTH_CHECK_INTERVAL:-30s}
      timeout: ${HEALTH_CHECK_TIMEOUT:-10s}
      retries: ${HEALTH_CHECK_RETRIES:-60}
    deploy:
      resources:
        limits:
          cpus: ${POSTGRES_CPU_LIMIT:-1.0}
          memory: ${POSTGRES_MEMORY_LIMIT:-1G}
        reservations:
          cpus: ${POSTGRES_CPU_RESERVATION:-0.1}
          memory: ${POSTGRES_MEMORY_RESERVATION:-256M}

  # MySQL Database
  mysql:
    <<: *defaults
    image: ${GLOBAL_REGISTRY:-}mysql:${MYSQL_VERSION:-8.4.6}
    environment:
      TZ: ${TZ:-UTC}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${CONSOLE_MYSQL_DB:-astron_console}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - astron-agent-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: ${HEALTH_CHECK_INTERVAL:-30s}
      timeout: ${HEALTH_CHECK_TIMEOUT:-10s}
      retries: ${HEALTH_CHECK_RETRIES:-60}
    deploy:
      resources:
        limits:
          cpus: ${MYSQL_CPU_LIMIT:-1.5}
          memory: ${MYSQL_MEMORY_LIMIT:-2G}
        reservations:
          cpus: ${MYSQL_CPU_RESERVATION:-0.1}
          memory: ${MYSQL_MEMORY_RESERVATION:-512M}

  # Redis Cache
  redis:
    <<: *defaults
    image: ${GLOBAL_REGISTRY:-}redis:${REDIS_VERSION:-7}
    volumes:
      - redis_data:/data
    networks:
      - astron-agent-network
    command: redis-server ${REDIS_PASSWORD:+--requirepass} ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a \"$REDIS_PASSWORD\"} ping | grep PONG"]
      interval: ${HEALTH_CHECK_INTERVAL:-30s}
      timeout: ${HEALTH_CHECK_TIMEOUT:-10s}
      retries: ${HEALTH_CHECK_RETRIES:-60}
    deploy:
      resources:
        limits:
          cpus: ${REDIS_CPU_LIMIT:-0.5}
          memory: ${REDIS_MEMORY_LIMIT:-512M}
        reservations:
          cpus: ${REDIS_CPU_RESERVATION:-0.1}
          memory: ${REDIS_MEMORY_RESERVATION:-128M}

  # Validate object-storage configuration before MinIO starts. The bundled
  # stack has zero-configuration credentials like the other private middleware
  # services; this one-shot check keeps all consumers aligned without printing
  # the credentials.
  # The bundled MinIO image does not provision a second application user, so
  # the OSS client credentials must match the configured MinIO root account.
  minio-credentials-check:
    image: ${GLOBAL_REGISTRY:-}busybox:${BUSYBOX_VERSION:-1.35}
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin123}"
      OSS_ACCESS_KEY_ID: "${OSS_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-minioadmin}}"
      OSS_ACCESS_KEY_SECRET: "${OSS_ACCESS_KEY_SECRET:-${MINIO_ROOT_PASSWORD:-minioadmin123}}"
      OSS_REMOTE_ENDPOINT: "${OSS_REMOTE_ENDPOINT:-http://minio.localhost:${EXPOSE_MINIO_PORT:-18998}}"
    command:
      - /bin/sh
      - -ec
      - |
        reject_configuration() {
          echo "Object-storage credential configuration is invalid." >&2
          exit 1
        }
        [ -n "$${MINIO_ROOT_USER}" ] || reject_configuration
        [ -n "$${MINIO_ROOT_PASSWORD}" ] || reject_configuration
        [ -n "$${OSS_ACCESS_KEY_ID}" ] || reject_configuration
        [ -n "$${OSS_ACCESS_KEY_SECRET}" ] || reject_configuration
        [ "$${MINIO_ROOT_USER}" != "$${MINIO_ROOT_PASSWORD}" ] || reject_configuration
        [ "$${OSS_ACCESS_KEY_ID}" != "$${OSS_ACCESS_KEY_SECRET}" ] || reject_configuration
        if [ "$${MINIO_ROOT_USER}" != "$${OSS_ACCESS_KEY_ID}" ] || \
           [ "$${MINIO_ROOT_PASSWORD}" != "$${OSS_ACCESS_KEY_SECRET}" ]; then
          echo "Bundled MinIO requires OSS credentials to match MINIO_ROOT credentials." >&2
          exit 1
        fi
        case "$${OSS_REMOTE_ENDPOINT}" in http://*|https://*) ;; *)
          echo "OSS_REMOTE_ENDPOINT must be an exact http(s) origin." >&2
          exit 1
        esac
        remote_authority="$${OSS_REMOTE_ENDPOINT#*://}"
        case "$${remote_authority}" in ""|*/*|*\?*|*\#*|*@*)
          echo "OSS_REMOTE_ENDPOINT must not contain credentials, a path, query, or fragment." >&2
          exit 1
        esac
        echo "Object-storage configuration check passed."
    network_mode: none
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: ${MINIO_CREDENTIALS_CHECK_CPU_LIMIT:-0.1}
          memory: ${MINIO_CREDENTIALS_CHECK_MEMORY_LIMIT:-64M}

  # MinIO Object Storage. API and console ports are deliberately bound to the
  # host loopback interface; containers use the private Compose network.
  minio:
    <<: *defaults
    image: ${GLOBAL_REGISTRY:-}minio/minio:${MINIO_VERSION:-RELEASE.2025-07-23T15-54-02Z}
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin123}"
      MINIO_SERVER_URL: "${OSS_REMOTE_ENDPOINT:-http://minio.localhost:${EXPOSE_MINIO_PORT:-18998}}"
    ports:
      - "127.0.0.1:${MINIO_PORT_OVERRIDE:-18998}:${EXPOSE_MINIO_PORT:-18998}"
      - "127.0.0.1:${MINIO_CONSOLE_PORT_OVERRIDE:-18999}:${EXPOSE_MINIO_CONSOLE_PORT:-18999}"
    volumes:
      - minio_data:/data
    networks:
      astron-agent-network:
        aliases:
          # Browsers resolve *.localhost to host loopback; containers resolve
          # this same signed hostname directly to MinIO on the private network.
          - minio.localhost
    command: server /data --address ":${EXPOSE_MINIO_PORT:-18998}" --console-address ":${EXPOSE_MINIO_CONSOLE_PORT:-18999}"
    depends_on:
      minio-credentials-check:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${EXPOSE_MINIO_PORT:-18998}/minio/health/live"]
      interval: ${HEALTH_CHECK_INTERVAL:-30s}
      timeout: ${HEALTH_CHECK_TIMEOUT:-10s}
      retries: ${HEALTH_CHECK_RETRIES:-60}
    deploy:
      resources:
        limits:
          cpus: ${MINIO_CPU_LIMIT:-1.0}
          memory: ${MINIO_MEMORY_LIMIT:-1G}
        reservations:
          cpus: ${MINIO_CPU_RESERVATION:-0.1}
          memory: ${MINIO_MEMORY_RESERVATION:-256M}

  # ============================================================================
  # astron-agent Core Services
  # ============================================================================

  # Tenant Service
  core-tenant:
    <<: *defaults
    image: ghcr.io/iflytek/astron-agent/core-tenant:${ASTRON_AGENT_VERSION:-1.1.2}
    environment:
      SERVICE_PORT: "${CORE_TENANT_PORT:-5052}"
      SERVICE_LOCATION: "${SERVICE_LOCATION:-hf}"
      DATABASE_DB_TYPE: "${DATABASE_DB_TYPE:-mysql}"
      DATABASE_USERNAME: "${DATABASE_USERNAME:-root}"
      DATABASE_PASSWORD: "${DATABASE_PASSWORD:-root123}"
      DATABASE_URL: "${DATABASE_URL:-(localhost:3306)/tenant}"
      DATABASE_MAX_OPEN_CONNS: "${DATABASE_MAX_OPEN_CONNS:-5}"
      DATABASE_MAX_IDLE_CONNS: "${DATABASE_MAX_IDLE_CONNS:-5}"
      LOG_PATH: "${LOG_PATH:-log.txt}"
      TENANT_ID: "680ab54f"
      TENANT_KEY_FILE: "/app/secrets/tenant/tenant-key"
      TENANT_SECRET_FILE: "/app/secrets/tenant/tenant-secret"
    depends_on:
      internal-credentials-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./config/tenant/logs:/opt/tenant/logs
      - ./config/tenant/config.toml:/opt/tenant/config/config.toml
      - tenant_bootstrap_secrets:/app/secrets/tenant:ro
    networks:
      - astron-agent-network
    deploy:
      resources:
        limits:
          cpus: ${CORE_TENANT_CPU_LIMIT:-2.0}
          memory: ${CORE_TENANT_MEMORY_LIMIT:-2G}
        reservations:
          cpus: ${CORE_TENANT_CPU_RESERVATION:-0.1}
          memory: ${CORE_TENANT_MEMORY_RESERVATION:-512M}

  # Memory Database Service

  core-database:
    <<: *defaults
    image: ghcr.io/iflytek/astron-agent/core-database:${ASTRON_AGENT_VERSION:-1.1.2}
    environment:
      SERVICE_PORT: "${CORE_DATABASE_PORT:-7990}"
      DB_TYPE: "${DB_TYPE:-postgresql}"
      PGSQL_HOST: "${POSTGRES_HOST:-postgres}"
      PGSQL_PORT: "${POSTGRES_PORT:-5432}"
      PGSQL_USER: "${POSTGRES_USER:-spark}"
      PGSQL_PASSWORD: "${POSTGRES_PASSWORD:-spark123}"
      PGSQL_DATABASE: "${DATABASE_POSTGRES_DATABASE:-sparkdb_manager}"
      MYSQL_HOST: "${MYSQL_HOST:-mysql}"
      MYSQL_PORT: "${MYSQL_PORT:-3306}"
      MYSQL_USER: "${MYSQL_USER:-root}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-root123}"
      MYSQL_DATABASE: "${DATABASE_MYSQL_DATABASE:-sparkdb_manager}"
      OTLP_ENDPOINT: "${OTLP_ENDPOINT:-127.0.0.1:4317}"
      OTLP_ENABLE: "${OTLP_ENABLE:-0}"
      REDIS_ADDR: "${REDIS_ADDR:-redis:6379}"
      REDIS_CLUSTER_ADDR: "${REDIS_CLUSTER_ADDR}"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./config/database/config.env:/opt/core/memory/database/config.env
      - ./config/database/logs/:/opt/core/memory/database/logs
    networks:
      - astron-agent-network
    deploy:
      resources:
        limits:
          cpus: ${CORE_DATABASE_CPU_LIMIT:-2.0}
          memory: ${CORE_DATABASE_MEMORY_LIMIT:-2G}
        reservations:
          cpus: ${CORE_DATABASE_CPU_RESERVATION:-0.1}
          memory: ${CORE_DATABASE_MEMORY_RESERVATION:-512M}

  # RPA Plugin Service
  core-rpa:
    <<: *defaults
    image: ghcr.io/iflytek/astron-agent/core-rpa:${ASTRON_AGENT_VERSION:-1.1.2}
    environment:
      SERVICE_PORT: "${CORE_RPA_PORT:-17198}"
      OTLP_ENDPOINT: "${OTLP_ENDPOINT:-127.0.0.1:4317}"
      OTLP_ENABLE: "${OTLP_ENABLE:-0}"
      KAFKA_ENABLE: "${KAFKA_ENABLE:-0}"
      KAFKA_SERVERS: "${KAFKA_SERVERS:-kafka:29092}"
      XIAOWU_RPA_TASK_CREATE_URL: "${XIAOWU_RPA_TASK_CREATE_URL_INTERNAL:-${XIAOWU_RPA_TASK_CREATE_URL}}"
      XIAOWU_RPA_TASK_QUERY_URL: "${XIAOWU_RPA_TASK_QUERY_URL_INTERNAL:-${XIAOWU_RPA_TASK_QUERY_URL}}"
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./config/rpa/config.env:/opt/core/plugin/rpa/config.env
      - ./config/rpa/logs/:/opt/core/logs/
    networks:
      - astron-agent-network
    deploy:
      resources:
        limits:
          cpus: ${CORE_RPA_CPU_LIMIT:-2.0}
          memory: ${CORE_RPA_MEMORY_LIMIT:-2G}
        reservations:
          cpus: ${CORE_RPA_CPU_RESERVATION:-0.1}
          memory: ${CORE_RPA_MEMORY_RESERVATION:-512M}

  # Link Plugin Service
  core-link:
    <<: *defaults
    image: ghcr.io/iflytek/astron-agent/core-link:${ASTRON_AGENT_VERSION:-1.1.2}
    environment:
      SERVICE_PORT: "${CORE_LINK_PORT:-18888}"
      MYSQL_HOST: "${MYSQL_HOST:-mysql}"
      MYSQL_PORT: "${MYSQL_PORT:-3306}"
      MYSQL_USER: "${MYSQL_USER:-root}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-root123}"
      MYSQL_DB: "${LINK_MYSQL_DB:-spark-link}"
      REDIS_IS_CLUSTER: "${REDIS_IS_CLUSTER:-false}"
      REDIS_ADDR: "${REDIS_ADDR:-redis:6379}"
      REDIS_CLUSTER_ADDR: "${REDIS_CLUSTER_ADDR}"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      OTLP_ENDPOINT: "${OTLP_ENDPOINT:-127.0.0.1:4317}"
      OTLP_ENABLE: "${OTLP_ENABLE:-0}"
      KAFKA_ENABLE: "${KAFKA_ENABLE:-0}"
      KAFKA_SERVERS: "${KAFKA_SERVERS:-kafka:29092}"
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./config/link/config.env:/opt/core/plugin/link/config.env
      - ./config/link/logs/:/opt/core/plugin/link/logs/
    networks:
      - astron-agent-network
    deploy:
      resources:
        limits:
          cpus: ${CORE_LINK_CPU_LIMIT:-2.0}
          memory: ${CORE_LINK_MEMORY_LIMIT:-2G}
        reservations:
          cpus: ${CORE_LINK_CPU_RESERVATION:-0.1}
          memory: ${CORE_LINK_MEMORY_RESERVATION:-512M}

  # AI Tools Plugin Service
  core-aitools:
    <<: *defaults
    image: ghcr.io/iflytek/astron-agent/core-aitools:${ASTRON_AGENT_VERSION:-1.1.2}
    environment:
      SERVICE_PORT: "${CORE_AITOOLS_PORT:-18668}"
      OSS_TYPE: "${OSS_TYPE:-s3}"
      OSS_ENDPOINT: "${OSS_ENDPOINT:-http://minio:${EXPOSE_MINIO_PORT:-18998}}"
      OSS_ACCESS_KEY_ID: "${OSS_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-minioadmin}}"
      OSS_ACCESS_KEY_SECRET: "${OSS_ACCESS_KEY_SECRET:-${MINIO_ROOT_PASSWORD:-minioadmin123}}"
      OSS_BUCKET_NAME: "${OSS_BUCKET_NAME}"
      OSS_BUCKET_CONSOLE: "${OSS_BUCKET_CONSOLE:-console-oss}"
      OSS_DOWNLOAD_HOST: "${OSS_REMOTE_ENDPOINT:-http://minio.localhost:${EXPOSE_MINIO_PORT:-18998}}"
      OSS_TTL: "${OSS_TTL:-157788000}"
      KAFKA_ENABLE: "${KAFKA_ENABLE:-0}"
      KAFKA_SERVERS: "${KAFKA_SERVERS:-kafka:29092}"
      REDIS_CLUSTER_ADDR: "${REDIS_CLUSTER_ADDR}"
      REDIS_ADDR: "${REDIS_ADDR:-redis:6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_DATABASE: "${REDIS_DATABASE:-0}"
      REDIS_DATABASE_CONSOLE: "${REDIS_DATABASE_CONSOLE:-0}"
      MYSQL_HOST: "${MYSQL_HOST:-mysql}"
      MYSQL_PORT: "${MYSQL_PORT:-3306}"
      MYSQL_USER: "${MYSQL_USER:-root}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-root123}"
      CONSOLE_MYSQL_DB: "${CONSOLE_MYSQL_DB:-astron_console}"
      MYSQL_URL: "${MYSQL_URL:-jdbc:mysql://mysql:3306/astron_console?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&createDatabaseIfNotExist=true}"
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./config/aitools/config.env:/opt/core/plugin/aitools/config.env
      - ./config/aitools/logs/:/opt/core/logs/
    networks:
      - astron-agent-network
    deploy:
      resources:
        limits:
          cpus: ${CORE_AITOOLS_CPU_LIMIT:-2.0}
          memory: ${CORE_AITOOLS_MEMORY_LIMIT:-2G}
        reservations:
          cpus: ${CORE_AITOOLS_CPU_RESERVATION:-0.1}
          memory: ${CORE_AITOOLS_MEMORY_RESERVATION:-512M}

  # Agent Service
  core-agent:
    <<: *defaults
    image: ghcr.io/iflytek/astron-agent/core-agent:${ASTRON_AGENT_VERSION:-1.1.2}
    environment:
      SERVICE_LOCATION: "${SERVICE_LOCATION:-hf}"
      SERVICE_HOST: "${SERVICE_HOST:-0.0.0.0}"
