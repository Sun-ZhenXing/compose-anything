  # ============================================================================
  # astron-agent Console Services
  # ============================================================================

  # Nginx Reverse Proxy
  nginx:
    <<: *defaults
    image: ${GLOBAL_REGISTRY:-}nginx:${NGINX_VERSION:-1.25-alpine}
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "${ASTRON_PORT_OVERRIDE:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - console-frontend
      - console-hub
    networks:
      - astron-agent-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/nginx-health"]
      interval: ${HEALTH_CHECK_INTERVAL:-30s}
      timeout: ${HEALTH_CHECK_TIMEOUT:-10s}
      retries: ${HEALTH_CHECK_RETRIES:-60}
    deploy:
      resources:
        limits:
          cpus: ${NGINX_CPU_LIMIT:-1.0}
          memory: ${NGINX_MEMORY_LIMIT:-512M}
        reservations:
          cpus: ${NGINX_CPU_RESERVATION:-0.1}
          memory: ${NGINX_MEMORY_RESERVATION:-64M}

