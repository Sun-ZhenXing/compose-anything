          memory: ${CONSOLE_FRONTEND_MEMORY_LIMIT:-512M}
        reservations:
          cpus: ${CONSOLE_FRONTEND_CPU_RESERVATION:-0.1}
          memory: ${CONSOLE_FRONTEND_MEMORY_RESERVATION:-64M}

