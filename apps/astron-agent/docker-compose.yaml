    volumes:
      - artifact_upload_secrets:/app/secrets/artifact
      - sandbox_runtime_credential_secrets:/app/secrets/runtime
      - workflow_internal_secrets:/app/secrets/workflow:ro
      - tenant_bootstrap_secrets:/app/secrets/tenant:ro
    expose:
      - "8080"
    depends_on:
      internal-credentials-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:8080/health >/dev/null"]
      interval: ${HEALTH_CHECK_INTERVAL:-30s}
      timeout: ${HEALTH_CHECK_TIMEOUT:-10s}
      retries: ${HEALTH_CHECK_RETRIES:-60}
    networks:
      - astron-agent-network
    deploy:
      resources:
        limits:
          cpus: ${CONSOLE_HUB_CPU_LIMIT:-2.0}
          memory: ${CONSOLE_HUB_MEMORY_LIMIT:-2G}
        reservations:
          cpus: ${CONSOLE_HUB_CPU_RESERVATION:-0.1}
          memory: ${CONSOLE_HUB_MEMORY_RESERVATION:-512M}

  # ============================================================================
  # Optional Casdoor Authentication (profile: auth)
  # ============================================================================

  casdoor:
    <<: *defaults
    profiles: [auth]
    image: ${GLOBAL_REGISTRY:-}casbin/casdoor:${CASDOOR_VERSION:-v2.67.0}
    user: root
    ports:
      - "${CASDOOR_PORT_OVERRIDE:-8000}:8000"
    environment:
      - GIN_MODE=release
      - CONSOLE_DOMAIN=${CONSOLE_DOMAIN:-http://localhost}
      - HOST_BASE_ADDRESS=${HOST_BASE_ADDRESS:-http://localhost}
      - origin=${CONSOLE_CASDOOR_URL:-http://localhost:8000}
      - originFrontend=${CONSOLE_CASDOOR_URL:-http://localhost:8000}
    volumes:
      - ./casdoor/conf:/conf-templates:ro
      - ./casdoor/entrypoint.sh:/entrypoint.sh:ro
      - casdoor-logs:/logs
    networks:
      - astron-agent-network
    depends_on:
      - casdoor-mysql
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    deploy:
      resources:
        limits:
          cpus: ${CASDOOR_CPU_LIMIT:-1.0}
          memory: ${CASDOOR_MEMORY_LIMIT:-1G}
        reservations:
          cpus: ${CASDOOR_CPU_RESERVATION:-0.1}
          memory: ${CASDOOR_MEMORY_RESERVATION:-256M}

  casdoor-mysql:
    <<: *defaults
    profiles: [auth]
    image: ${GLOBAL_REGISTRY:-}mysql:${CASDOOR_MYSQL_VERSION:-8.4.6}
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: casdoor
      MYSQL_USER: casdoor
      MYSQL_PASSWORD: casdoor123
    volumes:
      - casdoor-mysql-data:/var/lib/mysql
    networks:
      - astron-agent-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: ${CASDOOR_MYSQL_CPU_LIMIT:-1.5}
          memory: ${CASDOOR_MYSQL_MEMORY_LIMIT:-2G}
        reservations:
          cpus: ${CASDOOR_MYSQL_CPU_RESERVATION:-0.1}
          memory: ${CASDOOR_MYSQL_MEMORY_RESERVATION:-512M}

# ============================================================================
# Network Configuration
# ============================================================================
networks:
  astron-agent-network:
    driver: bridge

# ============================================================================
# Volume Configuration
# ============================================================================
volumes:
  postgres_data:
    driver: local
  mysql_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  nginx_logs:
    driver: local
  artifact_upload_secrets:
    driver: local
  sandbox_runtime_credential_secrets:
    driver: local
  workflow_internal_secrets:
    driver: local
  tenant_bootstrap_secrets:
    driver: local
  casdoor-logs:
    driver: local
  casdoor-mysql-data:
    driver: local
