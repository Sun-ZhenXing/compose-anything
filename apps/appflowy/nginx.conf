worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  resolver 127.0.0.11 valid=10s;
  underscores_in_headers on;
  # Never log URI, query, headers, or request lines: AppFlowy tokens can be URL-embedded.
  log_format safe '$remote_addr $status $upstream_status $request_method $request_time';
  access_log /dev/stdout safe;
  error_log /dev/null crit;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 8080;
    server_name _;
    set $cloud_upstream http://appflowy_cloud:8000;
    set $admin_upstream http://admin_frontend:3000;
    set $gotrue_upstream http://gotrue:9999;
    set $minio_upstream http://minio:9000;
    location = /healthz { proxy_pass $cloud_upstream/health; }
    location = / { return 302 /console/web/login; }
    location /console/ { proxy_http_version 1.1; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_pass $admin_upstream; }
    location /api/ { proxy_http_version 1.1; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_pass $cloud_upstream; }
    location /ws/ { proxy_http_version 1.1; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_pass $cloud_upstream; }
    location /gotrue/ { rewrite ^/gotrue/(.*)$ /$1 break; proxy_http_version 1.1; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_pass $gotrue_upstream; }
    location /minio-api/ { rewrite ^/minio-api/(.*)$ /$1 break; proxy_http_version 1.1; proxy_set_header Host minio:9000; proxy_set_header X-Forwarded-Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; proxy_pass $minio_upstream; }
  }
}
